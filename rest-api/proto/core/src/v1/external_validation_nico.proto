syntax = "proto3";

package forge;

import "common_nico.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/NVIDIA/infra-controller/rest-api/proto/core";

// Durable external-validation hold lifecycle. UNSPECIFIED is never persisted.
enum ExternalValidationHoldState {
  EXTERNAL_VALIDATION_HOLD_STATE_UNSPECIFIED = 0;
  // No open attempt; the allocation gate remains active.
  EXTERNAL_VALIDATION_HOLD_STATE_PENDING = 1;
  // One active attempt owns the next validation allocation.
  EXTERNAL_VALIDATION_HOLD_STATE_ATTEMPT_OPEN = 2;
  // A result exists but instance cleanup and local validation are not confirmed.
  EXTERNAL_VALIDATION_HOLD_STATE_AWAITING_CLEANUP = 3;
  // Passed, cleanup, and local validation succeeded; excluded from active lists.
  EXTERNAL_VALIDATION_HOLD_STATE_SATISFIED = 4;
  // Allocation, ownership, or cleanup requires explicit operator resolution.
  EXTERNAL_VALIDATION_HOLD_STATE_RECOVERY = 5;
}

// Durable attempt result. UNSPECIFIED is invalid; terminal results are immutable.
enum ExternalValidationAttemptState {
  EXTERNAL_VALIDATION_ATTEMPT_STATE_UNSPECIFIED = 0;
  // No external result has been recorded; no workflow-specific expiry applies.
  EXTERNAL_VALIDATION_ATTEMPT_STATE_OPEN = 1;
  // Validation passed; the hold still requires successful cleanup.
  EXTERNAL_VALIDATION_ATTEMPT_STATE_PASSED = 2;
  // Validation failed; successful cleanup returns the hold to Pending.
  EXTERNAL_VALIDATION_ATTEMPT_STATE_FAILED = 3;
  // Work was cancelled; cancellation never satisfies the hold.
  EXTERNAL_VALIDATION_ATTEMPT_STATE_CANCELLED = 4;
}

// Allocation progress for one attempt. UNSPECIFIED is not a durable value.
enum ExternalValidationAllocationState {
  EXTERNAL_VALIDATION_ALLOCATION_STATE_UNSPECIFIED = 0;
  // Allocation has not been accepted or is confirmed not to have occurred.
  EXTERNAL_VALIDATION_ALLOCATION_STATE_NOT_STARTED = 1;
  // Allocation was accepted; an ambiguous outcome blocks another allocation.
  EXTERNAL_VALIDATION_ALLOCATION_STATE_CREATING = 2;
  // The instance and its request binding committed together.
  EXTERNAL_VALIDATION_ALLOCATION_STATE_CREATED = 3;
}

// Start response statuses are not persisted attempt states.
enum ExternalValidationStartStatus {
  EXTERNAL_VALIDATION_START_STATUS_UNSPECIFIED = 0;
  // A new attempt was opened, or the original keyed attempt is being replayed.
  EXTERNAL_VALIDATION_START_STATUS_OPENED = 1;
  // Another key already opened the active attempt; it is returned for recovery.
  EXTERNAL_VALIDATION_START_STATUS_ALREADY_OPEN = 2;
  // No eligible hold exists. No attempt is created.
  EXTERNAL_VALIDATION_START_STATUS_NO_ACTIVE_HOLD = 3;
}

// Accepted terminal results. UNSPECIFIED and unknown values are invalid.
enum ExternalValidationOutcome {
  // Omitted or unknown outcomes are rejected, never interpreted as success.
  EXTERNAL_VALIDATION_OUTCOME_UNSPECIFIED = 0;
  // External validation passed; cleanup and local validation still gate release.
  EXTERNAL_VALIDATION_OUTCOME_PASSED = 1;
  // External validation failed; the gate remains active for repair or retry.
  EXTERNAL_VALIDATION_OUTCOME_FAILED = 2;
  // Validation work stopped; the gate remains active after instance release.
  EXTERNAL_VALIDATION_OUTCOME_CANCELLED = 3;
}

// Durable attempt exposed for restart recovery and idempotent result replay.
message ExternalValidationAttempt {
  // Opaque UUID generated by NICo; never inferred from labels or an instance.
  string request_id = 1;
  // Stable UUID of the hold to which this attempt belongs.
  string hold_id = 2;
  // Caller UUID scoped to the Core site and validation tenant organization.
  string caller_idempotency_key = 3;
  // Open until a result is recorded; terminal values are immutable.
  ExternalValidationAttemptState state = 4;
  // NotStarted, Creating, or Created; returned even before an instance exists.
  ExternalValidationAllocationState allocation_state = 5;
  // Present after allocation commits; retained after instance deletion.
  common.InstanceId validation_instance_id = 6;
  // UTC time at which the attempt opened; attempts do not expire automatically.
  google.protobuf.Timestamp opened_at = 7;
  // Optional result/cancellation text or reference, at most 4096 UTF-8 bytes.
  optional string details = 8;
}

// NICo-owned allocation gate; no tenant API creates or removes this resource.
message ExternalValidationHold {
  // Stable UUID for the hold's validation cycle.
  string hold_id = 1;
  // Held host machine; required and never a DPU machine.
  common.MachineId machine_id = 2;
  // Configured Core tenant organization authorized to perform validation.
  string tenant_org_id = 3;
  // Opaque UUID for discovery/reprovision; normal validation release reuses it.
  string validation_cycle_id = 4;
  // Durable lifecycle state; an active list excludes Satisfied.
  ExternalValidationHoldState state = 5;
  // UTC creation time used for deterministic ordering.
  google.protobuf.Timestamp created_at = 6;
  // Current attempt while open, awaiting cleanup, or in recovery; absent in Pending.
  ExternalValidationAttempt attempt = 7;
}

// Lists all active holds in this site's authorized validation-tenant scope.
message ListExternalValidationHoldsRequest {
  // Required configured Core tenant organization. Other tenants are denied.
  string tenant_org_id = 1;
  // One-based page; omitted defaults to 1. Valid range: 1..21474836.
  optional uint32 page_number = 2;
  // Omitted defaults to 20. Valid range: 1..100; explicit zero is invalid.
  optional uint32 page_size = 3;
}

// A page ordered by (created_at, hold_id) ascending, with total before pagination.
message ListExternalValidationHoldsResponse {
  // Active holds only; an empty authorized scope succeeds with an empty list.
  repeated ExternalValidationHold holds = 1;
  // Count of matching active holds before pagination.
  uint64 total_count = 2;
  // Effective one-based page number, including an empty page beyond the end.
  uint32 page_number = 3;
  // Effective page size after applying the omission default.
  uint32 page_size = 4;
}

// Opens one attempt after verifying the held machine is Ready and unassigned.
message StartExternalValidationRequest {
  // Required held host machine. Replay uses the original identity even after assignment.
  common.MachineId machine_id = 1;
  // Required Core tenant organization, authorized for this site's policy.
  string tenant_org_id = 2;
  // Required caller UUID persisted before Start; replay always returns its original
  // attempt, including terminal state. Changing the machine conflicts; the key
  // never rebinds to a later hold.
  string caller_idempotency_key = 3;
}

// Start result; replay lookup precedes current machine eligibility checks.
message StartExternalValidationResponse {
  // Opened, AlreadyOpen, or NoActiveHold; never an unspecified response.
  ExternalValidationStartStatus status = 1;
  // Machine from the request, returned for every status.
  common.MachineId machine_id = 2;
  // Original hold for replay; absent only when no active hold exists.
  optional string hold_id = 3;
  // Original keyed attempt or already-open attempt; absent for NoActiveHold.
  ExternalValidationAttempt attempt = 4;
}

// Closes an attempt only before allocation has been accepted.
message CancelExternalValidationRequest {
  // Required request UUID. Identical replay of a recorded pre-allocation
  // cancellation returns the original Cancelled attempt, even after a newer
  // attempt opens, without modifying that newer attempt or its hold. Otherwise
  // the request must be current; stale requests and changed details conflict.
  string request_id = 1;
  // Required Core tenant organization, authorized for the hold's site.
  string tenant_org_id = 2;
  // Required nonempty reason, at most 4096 UTF-8 bytes. Identical replay succeeds;
  // a changed reason conflicts. Creating/Created cannot be cancelled this way.
  string details = 3;
}

// Records a result for an allocated instance without releasing the allocation gate.
message CompleteExternalValidationRequest {
  // Required active request UUID, or the original tuple for identical terminal replay.
  string request_id = 1;
  // Required Core tenant organization; request identity is not authorization.
  string tenant_org_id = 2;
  // Required Core instance ID returned by the request-bound AllocateInstance RPC.
  common.InstanceId validation_instance_id = 3;
  // Required Passed, Failed, or Cancelled. Unspecified/unknown values are invalid.
  ExternalValidationOutcome outcome = 4;
  // Optional text or result reference, at most 4096 UTF-8 bytes. Replay must
  // repeat the result, instance ID, and details; conflicting completion is rejected.
  optional string details = 5;
}
